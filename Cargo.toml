[package]
name = "screen_overlay"
version = "0.1.0"
edition = "2021"
authors = ["Ivor Wanders <ivor@iwanders.net>"]
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
#array-init = "2.0.0"
parking_lot = "0.12.3"
serde =  { version = "1.0", features = ["derive"] }
image = { version = "0.25.1",  default-features = false, features = ["png"]}


# Winit backend attempt
log = "0.4"
winit = "0.30.12"
#eframe = {version="0.33.3"}
#egui  = "0.33.3"
#egui_extras = {version="0.33.3", features=["image"]}
env_logger = "0.11.8"

eframe = {version="0.33.3", path="../egui/crates/eframe/"}
egui = {version="0.33.3", path="../egui/crates/egui/"}
egui_extras = {version="0.33.3", path="../egui/crates/egui_extras/", features=["image"]}

# Latest head has a fix for the passthrough hit test.
# eframe = {git="https://github.com/emilk/egui.git", rev="9e95b9ca50c224077617434707f7bd29bd70938b", features=["glow"]}
# egui = {git="https://github.com/emilk/egui.git", rev="9e95b9ca50c224077617434707f7bd29bd70938b"}
# egui_extras = {git="https://github.com/emilk/egui.git", rev="9e95b9ca50c224077617434707f7bd29bd70938b",  features=["image"]}


[target.'cfg(windows)'.dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",

    # For d3d12
    "Foundation_Numerics",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Imaging_D2D",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_Animation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
]

[target.'cfg(any(target_os = "linux"))'.dependencies]
x11-dl = "2.21"
glfw = "0.60.0"
gl = "0.14.0"
parking_lot = "0.12.5"
three-d = "0.18.2"
